name: Generate snake animation

on:
  schedule: # ajaa animaation 12 tunnin välein
    - cron: "0 */12 * * *" 
  workflow_dispatch: # mahdollistaa manuaalisen ajon napista
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # TÄMÄ ON TÄRKEÄ: Estää GitHubia sammuttamasta workflowta 60 pv inaktiivisuuden jälkeen
      - uses: gautamkrishnar/keepalive-workflow@v1

      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Määritellään värit sopimaan profiilisi Dracula-teemaan
          # Tausta tumma, pisteet tummasta vaalean violettiin/pinkkiin
          outputs: |
            dist/snake.svg?color_snake=#bd93f9&color_dots=#282a36,#44475a,#6272a4,#bd93f9,#ff79c6

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
